<!DOCTYPE html>
<html>

  <script>

  </script>
<!-- 退出房间确认弹窗 -->
  <div id="exitConfirmModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5);">
    <div class="modal-content" style="background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 400px; border-radius: 8px;">
      <div class="modal-header" style="padding: 10px 0; border-bottom: 1px solid #eee;">
        <h2 style="margin: 0;">确认退出</h2>
      </div>
      <div class="modal-body" style="padding: 20px 0;">
        <p>您确认要退出房间吗？</p>
      </div>
      <div class="modal-footer" style="padding: 10px 0; text-align: right;">
        <button id="cancelExit" style="background-color: #6c757d; color: white; border: none; padding: 8px 16px; margin-right: 10px; border-radius: 4px; cursor: pointer;">取消</button>
        <button id="confirmExit" style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">继续</button>
      </div>
    </div>
  </div>
  
  <!-- 弹窗基础样式 -->
  <style>
    /* 弹窗容器基础样式 */
    #exitConfirmModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    /* 浅色模式下弹窗样式 */
    #exitConfirmModal {
      background-color: rgba(0,0,0,0.5);
    }
    #exitConfirmModal .modal-content {
      background-color: white;
      color: #333;
      border-color: #dee2e6;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    #exitConfirmModal .modal-header {
      border-bottom-color: #dee2e6;
    }
    #exitConfirmModal .modal-header h2 {
      color: #333;
    }
    #exitConfirmModal .modal-body p {
      color: #333;
    }
    #cancelExit {
      background-color: #6c757d;
      border-color: #6c757d;
    }
    #confirmExit {
      background-color: #dc3545;
      border-color: #dc3545;
    }
    
    /* 深色模式下弹窗样式 - 确保深色模式下正确显示 */
    body.dark-theme #exitConfirmModal {
      background-color: rgba(0,0,0,0.8) !important;
    }
    body.dark-theme #exitConfirmModal .modal-content {
      background-color: #2a2a2a !important;
      color: #e0e0e0 !important;
      border-color: #444 !important;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5) !important;
    }
    body.dark-theme #exitConfirmModal .modal-header {
      border-bottom-color: #444 !important;
    }
    body.dark-theme #exitConfirmModal .modal-header h2 {
      color: #e0e0e0 !important;
    }
    body.dark-theme #exitConfirmModal .modal-body p {
      color: #e0e0e0 !important;
    }
    body.dark-theme #cancelExit {
      background-color: #495057 !important;
      border-color: #495057 !important;
    }
    body.dark-theme #confirmExit {
      background-color: #c0392b !important;
      border-color: #c0392b !important;
    }
  </style>
  
  <!-- 退出房间按钮的JavaScript代码 -->
  <script>
    // 获取DOM元素
    const backButton = document.getElementById('backButton');
    const exitRoomButton = document.getElementById('exitRoomButton');
    const exitConfirmModal = document.getElementById('exitConfirmModal');
    const cancelExit = document.getElementById('cancelExit');
    const confirmExit = document.getElementById('confirmExit');
    
    // 返回上一页按钮点击事件 - 增加画中画功能
    backButton.addEventListener('click', function() {
      const videoElement = document.getElementById('videoPlayer');
      
      // 检查是否支持画中画功能
      if (videoElement && document.pictureInPictureEnabled && !videoElement.disablePictureInPicture) {
        // 如果当前不在画中画模式，则开启画中画
        if (document.pictureInPictureElement !== videoElement) {
          videoElement.requestPictureInPicture().then(() => {
            console.log('画中画模式已开启');
            // 画中画开启成功后才返回上一页
            if (window.history.length > 1) {
              window.history.back(); // 返回上一页
            } else {
              window.location.href = 'https://www.baidu.com'; // 如果没有历史记录则跳转到百度
            }
          }).catch(error => {
            console.error('画中画开启失败:', error);
            // 如果画中画失败，提示用户并直接返回
            addStatusMessage('画中画功能不可用，直接返回上一页');
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.href = 'https://www.baidu.com';
            }
          });
        } else {
          // 如果已经在画中画模式，直接返回上一页
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = 'https://www.baidu.com';
          }
        }
      } else {
        // 如果不支持画中画或没有视频元素，直接返回上一页
        addStatusMessage('浏览器不支持画中画功能，直接返回上一页');
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'https://www.baidu.com';
        }
      }
    });
    
    // 点击退出房间按钮，显示确认弹窗
    exitRoomButton.addEventListener('click', function() {
      showModal(exitConfirmModal);
    });
    
    // 点击取消按钮，关闭弹窗
    cancelExit.addEventListener('click', function() {
      hideModal(exitConfirmModal);
    });
    
    // 点击继续按钮，执行退出操作 - 仅退出当前房间，保留本地缓存数据
    confirmExit.addEventListener('click', function() {
      try {
        // 关闭弹窗
        hideModal(exitConfirmModal);
        
        // 如果已加入房间，发送离开房间消息给服务器
        if (currentRoom && socket && socket.connected) {
          // 发送离开房间消息给服务器（不直接断开socket连接）
          socket.emit('leave_room', { room: currentRoom });
          
          // 清空当前房间信息（但保留聊天记录和用户列表的HTML内容）
          currentRoom = '';
          currentRoomNameEl.innerHTML = '未加入房间';
          
          // 显示房间创建/加入弹窗，使用showModal函数确保居中
          if (roomModal) {
            showModal(roomModal);
          }
          
          // 添加状态消息
          addStatusMessage('已退出房间');
        }
      } catch (error) {
        console.error('退出房间错误:', error);
        alert('退出房间失败，请重试');
      }
    });
    
    // 点击弹窗外部区域，关闭弹窗
    window.addEventListener('click', function(event) {
      if (event.target === exitConfirmModal) {
        hideModal(exitConfirmModal);
      }
    });
    
    // 处理离开房间成功事件
    socket.on('leave_room_success', function(data) {
      console.log('离开房间成功:', data.message);
    });
    
    // 处理网络视频链接加载功能
    function initNetworkVideoLoading() {
      const videoUrlInput = document.getElementById('videoUrlInput');
      const loadUrlButton = document.getElementById('loadUrlButton');
      
      if (videoUrlInput && loadUrlButton) {
        loadUrlButton.addEventListener('click', function() {
          const videoUrl = videoUrlInput.value.trim();
          if (videoUrl) {
            handleNetworkVideoLoading(videoUrl);
          } else {
            alert('请输入有效的视频链接');
          }
        });
        
        // 支持回车键加载视频
        videoUrlInput.addEventListener('keypress', function(event) {
          if (event.key === 'Enter') {
            loadUrlButton.click();
          }
        });
      }
    }
    
    // HLS实例变量，用于管理m3u8流
    let hls = null;
    let hlsLoadTimeout = null;
    
    // 加载网络视频链接
    function handleNetworkVideoLoading(videoUrl) {
      // 简单的URL验证
      if (!isValidVideoUrl(videoUrl)) {
        alert('请输入有效的视频链接，支持MP4、M3U8等格式');
        return;
      }
      
      // 显示加载状态
      isLoading = true;
      addStatusMessage('正在加载网络视频...');
      
      // 保存当前视频的唯一标识
      currentVideoId = videoUrl;
      
      // 清除之前可能存在的HLS实例和超时计时器
      if (hls) {
        hls.destroy();
        hls = null;
      }
      if (hlsLoadTimeout) {
        clearTimeout(hlsLoadTimeout);
        hlsLoadTimeout = null;
      }
      
      // 重置视频元素
      videoPlayer.pause();
      videoPlayer.src = '';
      videoPlayer.controls = true; // 确保控制条可见
      
      // 检查是否为m3u8格式视频
      if (videoUrl.toLowerCase().includes('.m3u8')) {
        // 检查浏览器是否支持MSE和HLS.js库是否已加载
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            // 优化的HLS配置，适用于各种网络环境
            enableWorker: true,
            lowLatencyMode: false, // 禁用低延迟模式以提高兼容性
            backBufferLength: 30, // 减少缓冲时间
            maxBufferLength: 10,  // 减少最大缓冲区长度
            maxBufferSize: 0,     // 不限制缓冲区大小
            maxMaxBufferLength: 60, // 网络不好时的最大缓冲长度
            startFragPrefetch: true, // 启用片段预加载
            enableWebVtt: true, // 支持字幕
            enableCEA708Captions: true, // 支持隐藏字幕
            autoStartLoad: true, // 自动开始加载
            debug: false // 生产环境关闭调试
          });
          
          // 监听HLS关键事件
          hls.on(Hls.Events.MANIFEST_PARSED, function() {
            addStatusMessage('视频流解析成功，准备播放...');
            isLoading = false;
            
            // 尝试自动播放
            try {
              videoPlayer.play().catch(err => {
                console.log('自动播放失败，需要用户交互:', err);
                addStatusMessage('请点击播放按钮开始观看');
              });
            } catch (e) {
              console.error('播放错误:', e);
            }
          });
          
          // 监听加载进度
          hls.on(Hls.Events.BUFFER_CREATED, function(data) {
            console.log('缓冲区已创建，类型:', data.media);
          });
          
          hls.on(Hls.Events.BUFFER_APPENDING, function(data) {
            // 可以在这里添加缓冲进度条
            console.log('正在缓冲数据，类型:', data.media);
          });
          
          hls.on(Hls.Events.BUFFER_APPENDED, function(data) {
            console.log('缓冲数据已追加，类型:', data.media);
          });
          
          hls.on(Hls.Events.FRAG_LOADED, function(data) {
            console.log('片段已加载，持续时间:', data.frag.duration);
          });
          
          // 增强的错误处理
          hls.on(Hls.Events.ERROR, function(event, data) {
            isLoading = false;
            console.error('HLS错误:', data);
            
            let errorMessage = '视频加载失败';
            
            // 处理非致命错误
            if (!data.fatal) {
              // 对于网络错误，可以尝试继续加载
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                addStatusMessage('网络连接暂时中断，正在重试...');
                return;
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                addStatusMessage('媒体解码警告，但尝试继续播放');
                return;
              }
            }
            
            // 处理致命错误
            if (data.fatal) {
              switch(data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  errorMessage = '网络错误，无法连接到视频服务器，请检查网络连接';
                  // 尝试重新加载
                  setTimeout(() => {
                    if (hls) {
                      hls.startLoad();
                    }
                  }, 2000);
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  errorMessage = '媒体解码错误，可能不支持此视频格式或视频文件已损坏';
                  break;
                case Hls.ErrorTypes.MANIFEST_ERROR:
                  errorMessage = '视频流配置错误，无法解析播放列表';
                  break;
                default:
                  errorMessage = '无法加载视频流，请稍后再试';
                  break;
              }
              alert(errorMessage);
              
              // 销毁HLS实例
              if (hls) {
                hls.destroy();
                hls = null;
              }
            }
          });
          
          // 设置加载超时处理（30秒）
          hlsLoadTimeout = setTimeout(() => {
            if (isLoading && hls) {
              isLoading = false;
              alert('视频加载超时，请检查网络连接或尝试其他视频链接');
              hls.destroy();
              hls = null;
            }
          }, 30000);
          
          // 加载m3u8流
          try {
            hls.loadSource(videoUrl);
            hls.attachMedia(videoPlayer);
          } catch (error) {
            console.error('HLS加载失败:', error);
            isLoading = false;
            if (hlsLoadTimeout) {
              clearTimeout(hlsLoadTimeout);
              hlsLoadTimeout = null;
            }
            alert('无法加载m3u8格式视频，请检查链接是否有效');
          }
        } else {
          // 浏览器不支持HLS.js或库未正确加载
          alert('您的浏览器不支持直接播放m3u8格式视频，请尝试使用Chrome或Firefox浏览器');
          isLoading = false;
          
          // 尝试使用原生方式加载作为备选方案
          videoPlayer.src = videoUrl;
          videoPlayer.load();
        }
      } else {
        // 普通视频格式，使用原生方式加载
        videoPlayer.src = videoUrl;
        
        // 添加错误处理
        videoPlayer.onerror = function(error) {
          isLoading = false;
          console.error('视频加载错误:', error);
          
          // 检查是否是跨域问题
          if (error.target.error.code === error.target.error.MEDIA_ERR_SRC_NOT_SUPPORTED) {
            alert('无法加载视频，可能是跨域限制问题。请尝试使用其他视频链接。');
          } else {
            alert('视频加载失败，请检查链接是否有效');
          }
        };
        
        // 监听加载事件
        videoPlayer.onloadeddata = function() {
          isLoading = false;
        };
        
        videoPlayer.load();
      }
      
      // 通知房间内其他用户当前使用的视频资源
      if (currentRoom) {
        socket.emit('video_resource_update', {
          room: currentRoom,
          videoName: currentVideoId
        });
      }
    }
    
    // 验证视频URL是否有效
    function isValidVideoUrl(url) {
      // 检查是否以http/https开头
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return false;
      }
      
      // 检查常见的视频文件扩展名或流媒体格式
      const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.mkv', '.avi'];
      const streamFormats = ['.m3u8', '.mpd'];
      
      // 转换为小写进行比较
      const lowerUrl = url.toLowerCase();
      
      // 检查是否包含常见视频扩展名
      for (const ext of videoExtensions) {
        if (lowerUrl.endsWith(ext)) {
          return true;
        }
      }
      
      // 检查是否包含流媒体格式
      for (const format of streamFormats) {
        if (lowerUrl.includes(format)) {
          return true;
        }
      }
      
      // 对于没有明显扩展名的URL，我们仍然尝试加载
      // 因为有些视频服务可能使用动态URL
      return true;
    }
    
    // 初始化网络视频加载功能
    initNetworkVideoLoading();
  </script>
  
  </body>
</html>
